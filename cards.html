  <section class="content">
    <h2>點一下卡牌，看看背後的歷史</h2>

    <div class="cards">

      <div class="card">
        <div class="front">
          <small>公共建設卡</small>
          <h3>石門取水口</h3>
          <p>公共水源的起點</p>
        </div>
        <div class="back">
          <p>從大漢溪上游石門取水，利用台地向西北傾斜的地勢，讓水靠重力流上台地。</p>
        </div>
      </div>

      <div class="card">
        <div class="front">
          <small>公共建設卡</small>
          <h3>導水隧道</h3>
          <p>最困難的工程</p>
        </div>
        <div class="back">
          <p>導水路約 20.47 公里，其中 8 段隧道合計約 15.62 公里。</p>
        </div>
      </div>

      <div class="card">
        <div class="front">
          <small>歷史事件卡</small>
          <h3>久旱</h3>
          <p>本回合不配水</p>
        </div>
        <div class="back">
          <p>早期埤塘彼此不相通，久旱時容易乾涸，各地之間難以調配水量。</p>
        </div>
      </div>

    </div>
  </section>

  <footer>輔仁大學 藝術與文化創意學士學位學程　第十四屆第四組</footer>
