<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- 埤塘的今天：公園、運動場與城市（示意） -->
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9a7e0"/><stop offset="1" stop-color="#efe7fb"/></linearGradient></defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- 城市 -->
  <g fill="#7d6aa8">
    <rect x="60" y="300" width="120" height="400"/><rect x="200" y="360" width="90" height="340"/><rect x="310" y="250" width="140" height="450"/>
    <rect x="1120" y="280" width="130" height="420"/><rect x="1270" y="340" width="100" height="360"/><rect x="1390" y="230" width="150" height="470"/>
  </g>
  <g fill="#efe7fb" opacity=".6">
    <rect x="80" y="330" width="18" height="24"/><rect x="120" y="330" width="18" height="24"/><rect x="80" y="380" width="18" height="24"/><rect x="330" y="290" width="18" height="24"/><rect x="380" y="290" width="18" height="24"/><rect x="1140" y="310" width="18" height="24"/><rect x="1190" y="310" width="18" height="24"/><rect x="1410" y="270" width="18" height="24"/><rect x="1460" y="270" width="18" height="24"/>
  </g>
  <!-- 公園草地 -->
  <path d="M0 640 C400 600 1200 600 1600 640 L1600 1000 L0 1000Z" fill="#7fb36a"/>
  <!-- 跑道 -->
  <ellipse cx="800" cy="830" rx="520" ry="120" fill="none" stroke="#d36b4a" stroke-width="34"/>
  <ellipse cx="800" cy="830" rx="440" ry="80" fill="#8cc276"/>
  <!-- 從前埤塘的位置（虛線） -->
  <ellipse cx="800" cy="720" rx="300" ry="50" fill="#3c86c2" opacity=".25" stroke="#fff" stroke-width="4" stroke-dasharray="14 12"/>
  <!-- 樹 -->
  <g fill="#3f7d3a"><circle cx="200" cy="640" r="55"/><circle cx="270" cy="660" r="40"/><circle cx="1330" cy="640" r="55"/><circle cx="1400" cy="660" r="42"/><circle cx="560" cy="650" r="35"/><circle cx="1050" cy="650" r="35"/></g>
  <g fill="#5a3d2b"><rect x="194" y="690" width="12" height="40"/><rect x="1324" y="690" width="12" height="40"/></g>
  <!-- 散步的人 -->
  <g fill="#3b2f5a"><circle cx="1180" cy="760" r="10"/><rect x="1173" y="772" width="14" height="34" rx="6"/><circle cx="420" cy="770" r="10"/><rect x="413" y="782" width="14" height="34" rx="6"/></g>
</svg>
