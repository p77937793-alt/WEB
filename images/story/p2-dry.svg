<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- 台地高、河床低的剖面示意 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3c98b"/><stop offset="1" stop-color="#f7e2bd"/></linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c0653a"/><stop offset="1" stop-color="#7a3a1d"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1280" cy="190" r="90" fill="#fff4d6"/>
  <circle cx="1280" cy="190" r="140" fill="#fff4d6" opacity=".35"/>
  <!-- 台地（右） -->
  <path d="M560 560 C640 552 700 548 760 546 L1600 520 L1600 1000 L620 1000 Z" fill="url(#soil)"/>
  <path d="M560 560 C640 552 700 548 760 546 L1600 520 L1600 548 L760 572 C700 574 640 580 566 588 Z" fill="#c9a24f"/>
  <!-- 台地（左側低處另一邊） -->
  <path d="M0 600 L300 610 C330 612 350 620 360 640 L380 1000 L0 1000 Z" fill="url(#soil)"/>
  <path d="M0 600 L300 610 C330 612 350 620 356 632 L0 628 Z" fill="#c9a24f"/>
  <!-- 河谷與大漢溪（很低） -->
  <path d="M360 640 C390 760 420 860 470 900 C520 930 560 932 600 900 C620 860 600 700 566 588 L620 1000 L380 1000 Z" fill="#8a4a28"/>
  <path d="M440 890 C480 920 560 925 600 895 L600 915 C560 945 480 942 440 912 Z" fill="#2b7bb9"/>
  <!-- 乾裂的田 -->
  <g stroke="#7a3a1d" stroke-width="3" fill="none" opacity=".7">
    <path d="M860 600 l40 30 l-20 40 M1000 590 l-30 50 l40 30 M1150 585 l30 40 l-40 35 M1320 580 l-20 45 l35 30 M1460 575 l40 35"/>
  </g>
  <!-- 枯黃的作物 -->
  <g fill="#b88a3a">
    <path d="M900 545 l6 -40 l6 40 Z M960 543 l6 -34 l6 34 Z M1080 540 l6 -38 l6 38 Z M1210 536 l6 -30 l6 30 Z M1380 531 l6 -36 l6 36 Z M1500 528 l6 -28 l6 28 Z"/>
  </g>
  <!-- 小埤塘（快乾了） -->
  <ellipse cx="1230" cy="600" rx="70" ry="14" fill="#6aa0c8" opacity=".8"/>
  <!-- 高差示意箭頭 -->
  <g stroke="#fff" stroke-width="4" fill="none" stroke-dasharray="10 10" opacity=".85">
    <path d="M640 560 L640 880"/>
  </g>
  <path d="M628 870 L640 895 L652 870 Z M628 572 L640 547 L652 572 Z" fill="#fff" opacity=".85"/>
</svg>
