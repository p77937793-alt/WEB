  <rect width="1600" height="1000" fill="url(#dusk)"/>
  <path d="M0 640 L300 560 L520 610 L760 520 L1000 600 L1240 540 L1600 620 L1600 1000 L0 1000Z" fill="#5a4636" opacity=".8"/>
