<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一水千田｜互動灌溉地圖</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; color: #2d2a26; background: #2d2a26; }
  .app { display: flex; height: 100%; }
  .stage { position: relative; flex: 1; overflow: hidden; touch-action: none; cursor: grab; background: #e9dcc6; }
  .stage.dragging { cursor: grabbing; }
  svg { width: 100%; height: 100%; display: block; user-select: none; }

  /* ---- 圖層樣式 ---- */
  .rg { fill: rgba(255,255,255,0); stroke: rgba(255,255,255,.85); stroke-dasharray: 14 10; stroke-width: 3; cursor: pointer; transition: fill .2s; }
  .rg:hover { fill: rgba(43,123,185,.18); }
  .hide-regions .rg { stroke: none; }
  .flow { fill: none; stroke: #7fd4ff; stroke-linecap: round; stroke-dasharray: 24 36; animation: flow 1.6s linear infinite; pointer-events: none; }
  @keyframes flow { to { stroke-dashoffset: -60; } }
  .hide-flow .flow { display: none; }
  .pond { fill: rgba(43,123,185,0); stroke: #ffe066; stroke-width: 2.5; cursor: pointer; }
  .pond:hover, .pond.on { fill: rgba(255,224,102,.5); }
  .hide-ponds .pond { display: none; }
  .hide-pois .poi { display: none; }
  .poi { cursor: pointer; }
  .poi circle { fill: #b5532d; stroke: white; stroke-width: 3; }
  .poi text { fill: white; font-weight: bold; font-size: 20px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .poi .lb { fill: #2d2a26; font-size: 18px; text-anchor: start; paint-order: stroke; stroke: rgba(255,255,255,.9); stroke-width: 5px; font-weight: bold; }
  .poi.on circle { fill: #2b7bb9; }
  #dim { fill: rgba(20,18,15,.55); opacity: 0; pointer-events: none; transition: opacity .35s; }
  .selected #dim { opacity: 1; }
  #lift { transition: transform .45s cubic-bezier(.2,1.4,.4,1); pointer-events: none; }
  #liftEdge { fill: none; stroke: white; stroke-width: 5; }
  .branch { fill: #fff; stroke: #2b7bb9; stroke-width: 1.5; }

  /* ---- 控制列 ---- */
  .tools { position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
  .tools button, .layers { background: rgba(255,255,255,.95); border: 1px solid #d9cfbf; border-radius: 8px; font: inherit; }
  .tools button { width: 40px; height: 40px; font-size: 20px; cursor: pointer; }
  .layers { position: absolute; left: 62px; top: 12px; padding: 6px 10px; font-size: 13px; z-index: 5; display: flex; gap: 10px; flex-wrap: wrap; max-width: calc(100% - 80px); }
  .layers label { white-space: nowrap; cursor: pointer; }
  .hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(45,42,38,.85); color: white;
          padding: 6px 14px; border-radius: 999px; font-size: 13px; z-index: 5; pointer-events: none; transition: opacity .5s; white-space: nowrap; }

  /* ---- 資訊面板 ---- */
  .panel { width: 360px; background: #fffaf0; overflow-y: auto; padding: 16px 18px; border-left: 1px solid #d9cfbf; }
  .panel h2 { margin: 0 0 4px; font-size: 22px; color: #2b7bb9; }
  .panel h3 { margin: 16px 0 6px; font-size: 15px; color: #7a7166; }
  .panel p { margin: 6px 0; line-height: 1.65; font-size: 15px; }
  .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin: 10px 0; }
  .stat { background: white; border: 1px solid #e6dccb; border-radius: 8px; padding: 8px 4px; text-align: center; }
  .stat b { display: block; font-size: 22px; color: #b5532d; }
  .stat span { font-size: 12px; color: #7a7166; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid #d9cfbf; background: white; border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: #2b7bb9; color: #2b7bb9; }
  .bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: #eee; margin: 6px 0; }
  .bar i { display: block; }
  .uses { margin: 4px 0; padding-left: 18px; font-size: 14px; line-height: 1.6; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; color: white; background: #6b7280; margin-left: 6px; vertical-align: middle; }
  .tag.ok { background: #2f855a; } .tag.wait { background: #d97706; }
  .back { margin-top: 12px; border: 0; background: #2b7bb9; color: white; padding: 8px 16px; border-radius: 999px; font: inherit; cursor: pointer; }
  .note { font-size: 12px; color: #7a7166; line-height: 1.6; margin-top: 18px; border-top: 1px dashed #d9cfbf; padding-top: 10px; }

  @media (max-width: 760px) {
    .app { flex-direction: column; }
    .panel { width: 100%; height: 42%; border-left: 0; border-top: 1px solid #d9cfbf; }
    .layers { font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .flow { animation: none; } #lift { transition: none; } }
</style>

/* =========================================================
   3. 拖曳與縮放（改的是 SVG 的 viewBox）
   ========================================================= */
const FULL = { x: 0, y: 0, w: 4796, h: 3471 };
let vb = { ...FULL };
let hiRes = false;
function apply() {
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const rect = stage.getBoundingClientRect();
  const k = Math.max(vb.w / rect.width, vb.h / rect.height);   // 1 個螢幕像素 = k 個地圖單位
  gPoi.querySelectorAll('.poi').forEach(g => g.setAttribute('transform', `translate(${g.dataset.x},${g.dataset.y}) scale(${k})`));
  gFlow.querySelectorAll('.flow').forEach(f => f.setAttribute('stroke-width', Math.max(3, 4 * k)));
  if (!hiRes && vb.w < 2600) loadHiRes();          // 放大到一定程度才載入高解析地圖
}
function loadHiRes() {
  hiRes = true;
  const img = new Image();
  img.onload = () => { document.getElementById('base').setAttribute('href', img.src); document.getElementById('liftImg').setAttribute('href', img.src); };
  img.src = 'images/map-full.jpg';
}
function toMap(cx, cy) {   // 螢幕座標 → 地圖座標
  const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function zoomAt(cx, cy, f) {
  const p = toMap(cx, cy);
  const nw = Math.min(FULL.w * 1.2, Math.max(260, vb.w / f)); const s = nw / vb.w;
  vb = { x: p.x - (p.x - vb.x) * s, y: p.y - (p.y - vb.y) * s, w: nw, h: vb.h * s };
  apply();
}
let anim = null;
function flyTo(t, ms = 600) {   // 平滑移動到目標範圍
  cancelAnimationFrame(anim);
  const from = { ...vb }, t0 = performance.now();
  const step = now => {
    const u = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - u, 3);
    for (const k of ['x','y','w','h']) vb[k] = from[k] + (t[k] - from[k]) * e;
    apply(); if (u < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
function fitBox(b, pad = 0.15) {
  const w = b[2] - b[0], h = b[3] - b[1];
  const rect = stage.getBoundingClientRect(), ar = rect.width / rect.height;
  let W = w * (1 + pad * 2), Hh = h * (1 + pad * 2);
  if (W / Hh < ar) W = Hh * ar; else Hh = W / ar;
  return { x: b[0] + w / 2 - W / 2, y: b[1] + h / 2 - Hh / 2, w: W, h: Hh };
}

const pointers = new Map(); let last = null, pinch0 = null, moved = false;
stage.addEventListener('pointerdown', e => { pointers.set(e.pointerId, e); moved = false; last = { x: e.clientX, y: e.clientY }; if (pointers.size === 2) pinch0 = pinchInfo(); hideHint(); });
stage.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, e);
  if (pointers.size === 2) {
    const p = pinchInfo(); if (pinch0) { zoomAt(p.cx, p.cy, p.d / pinch0.d); pinch0 = p; moved = true; } return;
  }
  const dx = e.clientX - last.x, dy = e.clientY - last.y;
  if (!moved && Math.abs(dx) + Math.abs(dy) > 3) { moved = true; stage.classList.add('dragging'); try { stage.setPointerCapture(e.pointerId); } catch (_) {} }
  if (moved) {
    const rect = stage.getBoundingClientRect(); const k = Math.max(vb.w / rect.width, vb.h / rect.height);
    vb.x -= dx * k; vb.y -= dy * k; apply();
  }
  last = { x: e.clientX, y: e.clientY };
});
const up = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch0 = null; stage.classList.remove('dragging'); if (pointers.size === 1) { const o = [...pointers.values()][0]; last = { x: o.clientX, y: o.clientY }; } };
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
function pinchInfo() { const [a, b] = [...pointers.values()]; return { cx: (a.clientX + b.clientX) / 2, cy: (a.clientY + b.clientY) / 2, d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) }; }
stage.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.2 : 1 / 1.2); hideHint(); }, { passive: false });
svg.addEventListener('click', e => { if (!moved && e.target.id === 'base') showOverview(); });

const center = () => { const r = stage.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
document.getElementById('zin').onclick = () => zoomAt(...center(), 1.5);
document.getElementById('zout').onclick = () => zoomAt(...center(), 1 / 1.5);
document.getElementById('zfit').onclick = () => { showOverview(); flyTo(fitBox([300, 100, 4500, 3450], 0.02)); };
document.getElementById('zfull').onclick = () => { const d = document.documentElement; if (!document.fullscreenElement) d.requestFullscreen && d.requestFullscreen(); else document.exitFullscreen(); };
document.querySelectorAll('[data-layer]').forEach(cb => cb.addEventListener('change', () => stage.classList.toggle('hide-' + cb.dataset.layer, !cb.checked)));
stage.classList.add('hide-ponds');
function hideHint() { document.getElementById('hint').style.opacity = 0; }
window.addEventListener('resize', apply);

    <p>地圖上藍色的色塊就是埤塘，旁邊的小字是池號（例如 2-3 代表第二支線第 3 號池）。放大地圖就看得到。</p>
    <p><b>所在灌區</b>：${b ? b.name : '（範圍外）'}<span class="tag wait">程式推估</span></p>
    <button class="back" onclick="showOverview()">回到全圖說明</button>${noteHTML()}`;
}

/* =========================================================
   5. 右邊面板的內容
   ========================================================= */
const MAIN = ['L1','L2','L3','L4','L5','L6','L7','L8-1','L8','L9','L10','L11','L12-1'];
function noteHTML() {
  return `<div class="note">底圖：〈桃園農田水利會灌溉區域圖〉，比例尺五萬分之一（年代與出處待補）。<br>
    支線灌區是程式依圖上的紅色圳路推估的範圍，不是官方的灌區界線；埤塘數「圖上約」是程式辨識藍色色塊的數量，僅供參考。<br>
    原有／現有埤塘數：農田水利署〈桃園管理處灌區埤塘發展史〉（資料年份待核）。</div>`;
}
function showOverview() {
  clearSel();
  const total = MAIN.reduce((s, k) => s + BRANCH[k].orig, 0) + 16;        // +16 = 第十二支線
  const now = total - MAIN.reduce((s, k) => s + BRANCH[k].removed, 0);
  const seen = Object.values(MAP.pondCount).reduce((a, b) => a + b, 0);
  panel.innerHTML = `<h2>桃園大圳灌溉地圖</h2>
    <p>水從右下角的石門取水口進來，沿著導水路往北，在八德、桃園之間轉向西，再分成十多條支線，把水送進一口口埤塘和田裡。</p>
    <div class="stats">
      <div class="stat"><b>${total}</b><span>完工時線內<br>貯水池</span></div>
      <div class="stat"><b>${now}</b><span>現有<br>（廢除 ${total - now}）</span></div>
      <div class="stat"><b>${seen}</b><span>這張圖上<br>約可數到</span></div>
    </div>
    <h3>點一條支線，看它的灌區</h3>
    <div class="chips">${MAIN.map(k => `<button class="chip" style="border-left:6px solid ${COLORS[k]}" onclick="selectBranch('${k}')">${BRANCH[k].name}</button>`).join('')}
      <button class="chip" onclick="selectBranch('GF')">光復圳</button><button class="chip" onclick="selectBranch('DX')">大溪一帶</button></div>
    <h3>地圖上的地點</h3>
    <div class="chips">${POI.map(p => `<button class="chip" onclick="selectPoi(POI[${p.id - 1}], POI[${p.id - 1}].g)">${p.id}. ${p.name}</button>`).join('')}</div>
    <h3>小技巧</h3>
    <p>勾選上方「埤塘」，地圖上每一口辨識到的埤塘都會被圈起來，點一下可以看它屬於哪一條支線。</p>
    ${noteHTML()}`;
}
function showBranch(id) {
  const b = BRANCH[id];
  if (b.other) {
    panel.innerHTML = `<h2>${b.name}</h2><p>${b.text}</p>
      <p><b>圖上約可數到</b>：${MAP.pondCount[id] || 0} 口埤塘<span class="tag wait">程式辨識</span></p>
      <button class="back" onclick="showOverview()">回到全圖</button>${noteHTML()}`;
    return;
  }
  const now = b.orig - b.removed, pct = Math.round(now / b.orig * 100);
  panel.innerHTML = `<h2 style="color:${COLORS[id]}">${b.name}<span class="tag">${id}</span></h2>
    ${b.text ? `<p>${b.text}</p>` : ''}
    <div class="stats">
      <div class="stat"><b>${b.orig}</b><span>原有埤塘</span></div>
      <div class="stat"><b>${now}</b><span>現有</span></div>
      <div class="stat"><b>${b.removed}</b><span>已廢除</span></div>
    </div>
    <div class="bar"><i style="width:${pct}%;background:#2b7bb9"></i><i style="width:${100 - pct}%;background:#b5532d"></i></div>
    <p style="font-size:13px;color:#7a7166">藍色＝還在的埤塘，紅色＝已廢除</p>
    ${b.uses.length ? `<h3>廢除後變成什麼</h3><ul class="uses">${b.uses.map(u => `<li>${u}</li>`).join('')}</ul>` : '<p>這條支線的埤塘目前都還保留著。</p>'}
    <p><b>圖上約可數到</b>：${MAP.pondCount[id] || 0} 口<span class="tag wait">程式辨識</span></p>
    <button class="back" onclick="showOverview()">回到全圖</button>${noteHTML()}`;
}
function showPoi(p) {
  panel.innerHTML = `<h2>${p.id}. ${p.name}${p.status === 'wait' ? '<span class="tag wait">待核</span>' : ''}</h2>
    <p>${p.text}</p><button class="back" onclick="showOverview()">回到全圖</button>${noteHTML()}`;
}

/* 開始 */
showOverview();
requestAnimationFrame(() => { vb = fitBox([300, 100, 4500, 3450], 0.02); apply(); });
</script>
</body>
</html>
